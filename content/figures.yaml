# Text alternatives for the article's figure images.  Handwritten for the interactive
# edition; they describe what is drawn and add no claim beyond the figure and its caption.
# The captions themselves are generated from the manuscript.  width = display width in px.

"fig:barrier-blueprint":
  width: 720
  alt: >-
    Four rows of boxes and arrows. (a) Barrier, single-frame, single-head: input P_t (global)
    feeds a single-head network whose output is marked with a cross, labelled "Cannot compute
    global parity in this model". (b) Bypass 1, multi-frame input: input (P_{t-1}, P_t)
    (transition) feeds a single-head network whose output is marked with a check, labelled
    "Computes local difference Delta". (c) Bypass 2, multiple rollout heads: input P_t splits
    into heads pi_0 through pi_{B-1}, which join at a check mark labelled "Rollout outcomes
    recover B bits". (d) Bypass 3, persistent recurrence: rows of P_t then P_{t+1} feed a
    recurrent state s <- s XOR x_i, ending at a check mark labelled "Nim-sum after N row
    updates (growing latency)".

"fig:restoration-example":
  width: 760
  alt: >-
    Three boxes from left to right. Start (Q): heaps {3, 5, 6}, nim-sum = 0 (green). An arrow
    labelled "Opponent moves 5 to 4, delta = 5 XOR 4 = 1" leads to After Opponent (Q'): heaps
    {3, 4, 6}, nim-sum = 1 (red). A blue arrow labelled "Agent restores 3 to 2, matches
    delta = 1 (3 XOR 2 = 1)" leads to Restored (R): heaps {2, 4, 6}, nim-sum = 0 (green).

"fig:fsm-shootout-controller":
  width: 760
  alt: >-
    A row of controller states q_0 (use pi_0), q_1 (use pi_1), dots, q_{B-1} (use pi_{B-1}),
    linked left to right by arrows labelled r_0 = 0, r_1 = 0 and r_j = 0. From each state an
    arrow labelled r_j = 1 (a dashed arrow "there exists j with r_j = 1" from the dots) leads
    to the halting box "sigma(P) is not 0 (declare N)" above. From q_{B-1} an arrow labelled
    r_{B-1} = 0 leads to the halting box "sigma(P) = 0 (declare P)" below.

"fig:valacc-H20k4":
  width: 760
  alt: >-
    Line plot titled "Validation accuracy vs epoch (restoration dataset)", epochs 0 to 200 on
    the horizontal axis, validation accuracy 0 to 1 on the vertical axis, legend "1F val acc" and
    "2F val acc". The 1F curve stays
    flat near 0.08 throughout. The 2F curve starts near 0.2, rises to a plateau near 0.54
    until roughly epoch 30, rises steeply between roughly epochs 35 and 50, and stays near
    1.0 from about epoch 60 to epoch 200.

"fig:testacc-H20k4":
  width: 760
  alt: >-
    Line plot titled "Test accuracy of checkpointed agents" (legend "1F checkpoints" and "2F
    checkpoints") with markers at the ten saved
    checkpoints (epochs 1, 23, 45, 67, 89, 112, 134, 156, 178, 200). The 1F checkpoints stay
    near 0.08. The 2F checkpoints are about 0.21 at epoch 1, 0.54 at epoch 23, 0.88 at
    epoch 45, 0.99 at epoch 67 and essentially 1.0 from epoch 89 onwards.

"fig:construction-pipeline":
  width: 760
  alt: >-
    Six boxes connected in two rows: two frames (3,5,6) and (3,4,6), extraction of delta 1,
    proposed replacements (2,5,7), parallel decrease tests (true,false,false), selection of
    heap 0 and value 2, and output fields 1|00|010. Boxes group operations, not layers.
"fig:threshold-compilation":
  width: 760
  alt: >-
    Four boxes connected left to right: Boolean formulas of depth at most d; translating
    OR and NOT into one layer and AND into two; copying values forward to align dependencies;
    arranging outputs with at most 2d+2 threshold layers. Weights and thresholds are 0 or 1.
