  assumptions: "Rows are $B$-bit numbers in a fixed heap order; state $(s,q,v)$ of $2B+1$ bits; a reset between games restores $(0,0,0)$."
  correspondence: "Lean checks the per-update circuit (depth at most 4, size at most $28B+8$) and a fixed-scale XOR realisation. The summary mechanism stores summaries, not the history."
  audit_rows: [prop:streaming-nimsum]

- id: c-replay
