  correspondence: "{{lean:NimAudit.Fourier.nimBit_corr_of_tail}} applies the named `TailPremise`; that premise is not instantiated against a published theorem (see the open item)."
  audit_rows: [sec:spectral-view]

- id: eq:delta-extension
  short: "The total OR-of-XORs extension equals Δ's bit on single-change pairs; not a character for N≥2; degree two for N=1"
  category: checked-theorem
  lean: [NimAudit.RealFourier.dSign_enc_real, NimAudit.RealFourier.dC_not_character_real, NimAudit.RealFourier.dC_one_exactDeg_real, NimAudit.Fourier.dC_not_character, NimAudit.Fourier.gMask_delta, NimAudit.Fourier.char_unique, NimAudit.Fourier.no_low_degree_extension]
  lean_defs: [NimAudit.LocalRestore.dC, NimAudit.Fourier.dSign]
  assumptions: "The promised domain is pairs of boards that differ in at most one heap. It contains more than legal decreases: increases and unchanged pairs are included."
  correspondence: "The claim concerns the one specified extension $d_j$, not every extension of the partial delta function. A separate checked theorem shows that the degree-$2N$ global character is the unique character agreeing with the delta bit on all single-change pairs; it is not a statement about legal decreases only."
  depends_on: [lem:nimber-diff-ac0]
  audit_rows: [eq:delta-extension]

