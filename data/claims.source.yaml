# Claim map of the interactive edition: handwritten metadata.  The prose for levels 2 and 3
# lives in content/explanations/*.md (entries "explain/<id>" and "formal/<id>").
#
# Fields
#   id            claim id; equals the manuscript label when the claim is a labelled statement
#   target        block or label the claim attaches to (default: id)
#   snippet, in   for unlabelled prose: a unique source fragment and the heading id to search;
#                 the claim id then becomes a website-side anchor
#   part          for statements split into parts of different kinds
#   short         one-line claim
#   category      checked-theorem | checked-definition | checked-conditional |
#                 classical-external | empirical | informal | open
#   lean          principal Lean declarations (fully qualified), checked against the fresh export
#   lean_defs     further definitions to display
#   named_inputs  named classical hypotheses used (conditional claims)
#   assumptions   assumptions and domain (markdown)
#   correspondence  prose-to-formal notes (markdown)
#   depends_on    claim ids
#   audit_rows    labels of rows in the audited correspondence map (input/paper_proof_correspondence.json)
claims:

# ------------------------------------------------------------------ front matter, Section 1
- id: c-abstract
  target: abstract
  short: "Summary of the results; each is stated and qualified in the body of the paper"
  category: informal
  depends_on: [thm:sim-ac0, thm:singleframe-impossible.b, prop:restore, prop:rollout-sufficiency, prop:streaming-nimsum, prop:bypass-interfaces, c-exp-result-1f2f, c-fsm-results]

- id: c-intro-zhou
  snippet: "Our earlier work with Bei Zhou provides the empirical starting point."
  in: sec:intro
  short: "Earlier experiments (Zhou and Riis) found AlphaZero-style learning deteriorating on larger NIM boards"
  category: classical-external

- id: c-intro-ac0
  snippet: "The class $\\AC^0$ consists of polynomial-size Boolean circuits"
  in: sec:intro
  short: "AC⁰ circuits cannot compute global parity; the connection is made for an explicitly restricted model"
  category: classical-external
  depends_on: [thm:sim-ac0, rem:local-vs-global-parity.global]

- id: c-intro-necessary
  snippet: "Representability in $\\AC^0$ is a necessary condition for a fixed-latency computation"
  in: sec:intro
  short: "AC⁰ representability is necessary within the restricted model, not sufficient for training and not universal"
  category: informal
  depends_on: [thm:sim-ac0]

- id: c-intro-transition
  snippet: "The central observation is that while the \\emph{state} can be hard to process"
  in: sec:intro
  short: "Shallow components versus the complete sequential computation in the three bypasses"
  category: informal
  depends_on: [prop:restore, prop:bypass-interfaces, c-bypass-not-ac0]

- id: fig:barrier-blueprint
  short: "Schematic of the barrier and the three bypasses"
  category: informal
  depends_on: [thm:singleframe-impossible.b, prop:restore, prop:rollout-sufficiency, prop:streaming-nimsum]

- id: c-contributions
  target: sec:contrib-list1
  short: "List of contributions; each item points to a precise statement"
  category: informal
  depends_on: [thm:sim-ac0, thm:singleframe-impossible.b, lem:nimber-diff-ac0, prop:restore, prop:rollout-sufficiency, prop:single-policy-bound, thm:search-gap.i, prop:streaming-nimsum, c-exp-result-1f2f, c-fsm-results]

- id: c-scope
  target: sec:scope-list1
  short: "Scope: worst-case representational statements under explicit constraints, not training results"
  category: informal
  depends_on: [thm:sim-ac0, def:agent-types, c-exp-result-1f2f]

# ------------------------------------------------------------------ Section 2
- id: c-qset
  snippet: "a finite set independent of input length. The threshold bound applies \\emph{after} choosing the literal representation."
  in: sec:framework-fixedprecision
  short: "The fixed grid Q_{W,D}; rewriting a negative term as a literal raises the threshold"
  category: checked-definition
  lean: [NimAudit.AC0.Gate.Valid, NimAudit.AC0.gate_rat_iff, NimAudit.Windows.literal_shift]
  lean_defs: [NimAudit.AC0.Gate, NimAudit.AC0.ratFires]
  assumptions: "Constants $W,D\\in\\mathbb N$ with $D>0$; weights $\\ell/D$ with $0\\le\\ell\\le W$."

- id: def:quantised-inference
  short: "Fixed-scale quantised NN, RNN and LTST models: constant depth, polynomial size, fixed grid, bounded unrolling"
  category: checked-definition
  lean: [NimAudit.AC0.gate_ac0, NimAudit.FiniteNet.netFormula_spec, NimAudit.AC0.NetValid]
  lean_defs: [NimAudit.AC0.Gate, NimAudit.AC0.Gate.Valid, NimAudit.AC0.Layer, NimAudit.AC0.evalNet]
  assumptions: "Nonnegative literal weights; threshold at most $W$ in units of $1/D$; Boolean intermediate states; for recurrent and attention-style models, at most $T$ updates in total from an input-independent initial state."
  correspondence: "The Lean gate model is the literal-threshold gate of Definition A.1 after clearing denominators. It is not a model of arbitrary INT8 or floating-point inference."
  depends_on: [def:NN-formal, def:RNN-formal, def:LTST-formal]
  audit_rows: [def:quantised-inference]

- id: c-window-insufficient
  snippet: "A bound on the number of preceding states consulted by one update is insufficient"
  in: sec:framework-fixedprecision
  short: "A one-step recurrence h_{r+1}=h_r⊕x_r accumulates parity over an arbitrarily long stream"
  category: checked-theorem
  lean: [NimAudit.scan_invariant, NimAudit.Recurrent.circuit_resources]
  lean_defs: [NimAudit.scan]
  depends_on: [prop:streaming-nimsum, def:RNN-formal]

- id: c-witness
  snippet: "Consequently, whenever a threshold unit outputs $1$, there is a satisfying \\emph{witness}"
  in: par-why-fixed-scale-quantisation-suggests-an-ac0-abstraction
  short: "Fixed scale gives a witness of at most W literals, hence a constant-width DNF for each unit"
  category: checked-theorem
  lean: [NimAudit.AC0.Gate.bounded_witness, NimAudit.AC0.gate_ac0]
  depends_on: [lem:unit-ac0]
  audit_rows: [app:oneunit]

- id: c-not-floating
  snippet: "We emphasise that this is not a statement about floating-point arithmetic per se."
  in: par-why-fixed-scale-quantisation-suggests-an-ac0-abstraction
  short: "The abstraction excludes scale-adaptive regimes, which move towards TC⁰"
  category: informal
  depends_on: [rem:ac0-scope.model]

- id: rem:ac0-scope.model
  target: rem:ac0-scope
  part: "(model scope)"
  short: "The model has bounded thresholds; a fan-in-dependent threshold such as majority lies outside it"
  category: checked-definition
  lean: [NimAudit.Windows.majGate_not_valid]
  lean_defs: [NimAudit.Windows.majGate, NimAudit.AC0.Gate.Valid]
  correspondence: "The remark describes what the model leaves out. Lean checks the precise boundary case: a majority gate with coefficients in $\\{0,1\\}$ has threshold $\\lceil m/2\\rceil$, which exceeds every fixed $W$ once $m>2W$."
  audit_rows: [rem:ac0-scope]

- id: rem:ac0-scope.tc0
  target: rem:ac0-scope
  part: "(TC⁰)"
  short: "Scale-adaptive threshold circuits (TC⁰) can represent parity-like computations"
  category: classical-external

- id: rem:local-vs-global-parity.local
  target: rem:local-vs-global-parity
  part: "(local XOR)"
  short: "XOR of a constant number of bits or B-bit blocks is computable in AC⁰"
  category: checked-theorem
  lean: [NimAudit.Windows.blockXor_res, NimAudit.Windows.xorChain_res]
  lean_defs: [NimAudit.Windows.blockXor, NimAudit.Windows.xorChain]
  audit_rows: [rem:local-vs-global-parity]

- id: rem:local-vs-global-parity.global
  target: rem:local-vs-global-parity
  part: "(global parity)"
  short: "Global parity of n = NB bits is not in AC⁰"
  category: checked-conditional
  lean: [NimAudit.ClassicalBoundary.parityNotAC0_of_hastad]
  lean_defs: [NimAudit.ClassicalBoundary.HastadNegl, NimAudit.Barrier.ParityNotAC0]
  named_inputs: [HastadNegl]
  correspondence: "The worst-case statement `ParityNotAC0` is derived in Lean from the named external input `HastadNegl` (Håstad 2014, Corollary 3.2, in negligible-family form). The classical theorem itself is not proved."
  audit_rows: [rem:local-vs-global-parity]

- id: c-model-table
  target: par-why-fixed-scale-quantisation-suggests-an-ac0-abstraction-table1
  short: "What the model captures and does not capture about deployed inference"
  category: informal
  depends_on: [def:quantised-inference, thm:sim-ac0, lem:unit-ac0]

- id: c-primer
  snippet: "A classical result is that $\\mathrm{PARITY}\\notin\\AC^0$."
  in: par-circuit-complexity-primer
  short: "Circuit-complexity background: PARITY ∉ AC⁰, TC⁰ computes parity, fixed scale collapses to AC⁰"
  category: classical-external
  depends_on: [thm:sim-ac0, rem:local-vs-global-parity.global]

- id: thm:sim-ac0
  short: "Fixed-depth, fixed-grid literal-threshold networks (and bounded-unrolling extensions) are simulated by AC⁰ circuit families"
  category: checked-theorem
  lean: [NimAudit.AC0.network_ac0, NimAudit.FiniteNet.family_finite, NimAudit.Family.netFam_ac0, NimAudit.Windows.window_ac0, NimAudit.Windows.staged_ac0]
  lean_defs: [NimAudit.Family.AC0Fam, NimAudit.Family.NetFam]
  assumptions: "Fixed $W,D$, a fixed number $L$ of layers, polynomially bounded widths and fan-ins, all weights and thresholds on the grid; for recurrent and attention-style models a fixed total number $T$ of updates, each stage itself a valid gate network."
  correspondence: "Lean uses formulas (trees) as circuits; size counts every node and depth counts NOT gates, which is conservative. The attention-style extension is covered only in the gate-realised form of Definition A.3."
  depends_on: [lem:unit-ac0, lem:layer-ac0, def:NN-formal, def:RNN-formal, def:LTST-formal]
  audit_rows: [thm:sim-ac0, app:ac0proof]

# ------------------------------------------------------------------ Section 3
- id: c-rw-circuits
  target: par-circuit-complexity-and-neural-networks-p1
  short: "Related results on parity, threshold circuits and attention models"
  category: classical-external

- id: c-rw-quant
  target: par-quantised-inference-and-deployment-constraints-p1
  short: "The proof needs nonnegative literal weights, bounded thresholds and Boolean states, not just a quantisation format"
  category: informal
  depends_on: [thm:sim-ac0]

- id: c-rw-rl
  target: par-reinforcement-learning-in-combinatorial-games-p1
  short: "Prior work on RL difficulties in impartial games; the lower bound is about a restricted model"
  category: classical-external

- id: c-rw-history
  target: par-history-and-memory-in-rl-p1
  short: "History can reduce computational complexity even in fully observable games, given the zero-nim-sum promise"
  category: informal
  depends_on: [prop:restore, c-init-boundary]

# ------------------------------------------------------------------ Section 4
- id: def:impartial
  short: "Finite terminating impartial games under normal play"
  category: classical-external
  audit_rows: [def:impartial]

- id: c-terminal
  target: sec-impartial-games-p1
  short: "A position with no legal moves is terminal"
  category: checked-definition
  lean: [NimAudit.Game.terminal_iff_no_move]
  lean_defs: [NimAudit.Game.Terminal]

- id: def:nim
  short: "NIM positions and legal moves"
  category: checked-definition
  lean: [NimAudit.Game.Move, NimAudit.Game.move_sum_lt]
  audit_rows: [def:nim]

- id: c-sprague-grundy
  target: sec-sprague-grundy-theory-and-nim-sum-p1
  short: "Sprague–Grundy theorem; for NIM the Grundy value is the XOR of the heaps"
  category: classical-external
  depends_on: [thm:nim-win]

- id: def:nimsum
  short: "The nim-sum is the bitwise XOR of the heap sizes"
  category: checked-definition
  lean: [NimAudit.nimSum, NimAudit.nimSum_append]
  audit_rows: [def:nimsum]

- id: thm:nim-win
  short: "A NIM position is losing iff its nim-sum is zero; from a nonzero nim-sum there is a move to zero"
  category: checked-theorem
  lean: [NimAudit.Game.lose_iff, NimAudit.Game.win_iff, NimAudit.Game.exists_move_to_zero, NimAudit.Game.move_from_zero]
  lean_defs: [NimAudit.Game.Win, NimAudit.Game.Lose]
  assumptions: "Finite normal-play NIM; heap sizes are natural numbers; any number of heaps."
  audit_rows: [thm:nim-win]

- id: c-why-nim
  target: par-why-nim-is-a-useful-barrier-example-p1
  short: "NIM isolates the XOR aggregation obstruction; extensions to other games need explicit reductions"
  category: informal

# ------------------------------------------------------------------ Section 5.1–5.3
- id: def:mastery
  short: "Strong, weak and restoration mastery"
  category: checked-definition
  lean: [NimAudit.Mastery.StrongMastery, NimAudit.Mastery.WeakMastery, NimAudit.Mastery.Guarantee, NimAudit.Mastery.Cons, NimAudit.Mastery.weakMastery_vacuous, NimAudit.Game.restore_correct]
  lean_defs: [NimAudit.Mastery.Hist, NimAudit.Mastery.Strat, NimAudit.Mastery.RoleWinnable]
  assumptions: "A designated role (first or second player) and a family of initial boards; deterministic, history-dependent strategies; legal opponents; a missing or illegal agent move is a loss."
  correspondence: "Weak mastery quantifies over histories consistent with the agent's own earlier actions; strong mastery over all legal histories. On an initially losing board the weak-mastery condition is vacuous, and Lean states this explicitly."
  audit_rows: [def:mastery]

- id: c-weak-mastery-histories
  target: sec-mastery-notions-p2
  short: "Weak mastery = moving to a P-position at every decision history consistent with the agent's own play"
  category: checked-theorem
  lean: [NimAudit.Mastery.secure_iff_guarantee, NimAudit.Mastery.weakMastery_iff_optimal, NimAudit.Mastery.roleWinnable_first]
  depends_on: [def:mastery, thm:nim-win]
  audit_rows: [def:mastery]

- id: thm:singleframe-impossible.a
  target: thm:singleframe-impossible
  part: "(reduction)"
  short: "Strong mastery on the boards (2,b₁,…,b_m) forces the winning move to reveal the parity of b"
  category: checked-theorem
  lean: [NimAudit.Game.unique_zero_move, NimAudit.Game.winning_selector_parity, NimAudit.ParityCircuit.extraction]
  lean_defs: [NimAudit.Game.encode, NimAudit.Game.reduced]
  assumptions: "Boards $(2,b_1,\\dots,b_m)$ with $b_i\\in\\{0,1\\}$, two bits per heap; all such boards are winning."
  audit_rows: [thm:singleframe-impossible]

- id: thm:singleframe-impossible.b
  target: thm:singleframe-impossible
  part: "(barrier)"
  short: "No polynomial-size, constant-depth fixed-scale network family strongly masters NIM"
  category: checked-conditional
  lean: [NimAudit.Barrier.barrier_net, NimAudit.Barrier.barrier_fam, NimAudit.ClassicalBoundary.parityNotAC0_of_hastad]
  lean_defs: [NimAudit.Barrier.ParityNotAC0, NimAudit.ClassicalBoundary.HastadNegl]
  named_inputs: [HastadNegl]
  assumptions: "Fixed grid $W$, a fixed number of layers, polynomial widths and fan-ins; the network's output is decoded as a binary move (valid bit, index bits, value bits)."
  correspondence: "Lean proves: if `ParityNotAC0` holds, no such network family plays a winning move on every encoded board; and `HastadNegl` implies `ParityNotAC0`. Parity hardness itself is the external classical input."
  depends_on: [thm:singleframe-impossible.a, thm:sim-ac0, rem:local-vs-global-parity.global]
  audit_rows: [thm:singleframe-impossible]

- id: def:nimber-difference
  short: "The nimber difference Δ(P,P') = nim(P) ⊕ nim(P')"
  category: checked-definition
  lean: [NimAudit.one_heap_difference]
  lean_defs: [NimAudit.nimSum]
  correspondence: "Lean writes $\\Delta$ inline as `nimSum P ^^^ nimSum P'`; there is no separate named definition."
  audit_rows: [def:nimber-difference]

- id: c-delta-local
  target: sec:multiframe-p2
  short: "If one heap changes from x_i to x_i', then Δ = x_i ⊕ x_i'"
  category: checked-theorem
  lean: [NimAudit.one_heap_difference, NimAudit.Misc.delta_bit_local]
  depends_on: [def:nimber-difference]

- id: lem:nimber-diff-ac0
  short: "With at most t changed heaps (t fixed), Δ is computed by polynomial-size constant-depth circuits"
  category: checked-theorem
  lean: [NimAudit.LocalRestore.bdC_eval, NimAudit.LocalRestore.bdDelta_eq, NimAudit.LocalRestore.bdC_res]
  lean_defs: [NimAudit.LocalRestore.bdC, NimAudit.LocalRestore.tf]
  assumptions: "Both boards have $N$ heaps of $B$ bits and differ in at most $t$ heaps; $t$ is a fixed constant (the depth bound $2t+8$ and the size exponent depend on $t$)."
  audit_rows: [lem:nimber-diff-ac0, app:nimberdiff]

- id: prop:restore
  short: "Matching the opponent's nimber difference restores nim-sum zero"
  category: checked-theorem
  lean: [NimAudit.conditional_restoration, NimAudit.one_heap_difference]
  assumptions: "The predecessor $Q$ has nim-sum zero and $Q\\to Q'$ is the opponent's move."
  correspondence: "The proposition is the algebra in {{lean:NimAudit.conditional_restoration}}, stated for the three nim-sums $q=\\operatorname{nim}(Q)$, $q'=\\operatorname{nim}(Q')$, $r=\\operatorname{nim}(R)$. Legality of the reply is not needed for this step; the shallow selector in the next sentence is a separate record."
  depends_on: [def:nimber-difference]
  audit_rows: [prop:restore]

- id: c-restore-selector
  target: sec:restoration-p2
  short: "A restoration move can be selected from (Q,Q') by a constant-depth circuit"
  category: checked-theorem
  lean: [NimAudit.LocalRestore.restore_equiv, NimAudit.LocalRestore.restC_bound, NimAudit.Family.rest_semantics, NimAudit.WholeGame.twoFrame_wins]
  lean_defs: [NimAudit.LocalRestore.restC, NimAudit.Game.restore]
  assumptions: "Equal lengths $N$, heaps below $2^B$, $\\operatorname{nim}(Q)=0$ and $Q\\to Q'$ legal."
  depends_on: [prop:restore, c-candidate-moves]
  audit_rows: [prop:restore]

- id: fig:restoration-example
  short: "Worked example: (3,5,6) → (3,4,6) → (2,4,6)"
  category: checked-theorem
  lean: [NimAudit.Misc.restoration_figure]

- id: c-mirror-delta
  target: par-interpretation-mirror-the-delta-p2
  short: "Testing whether a candidate move realises δ is a local check on the heap being changed"
  category: checked-theorem
  lean: [NimAudit.AttainCircuit.cancel_iff_bit, NimAudit.LocalRestore.localDelta_eq]
  depends_on: [prop:restore, c-delta-local]

- id: c-mcts-sentence
  target: par-interpretation-mirror-the-delta-p3
  short: "The significance of two frames for learning is representational"
  category: informal
  depends_on: [prop:restore, thm:singleframe-impossible.b]

- id: c-impl-overview
  target: sec-implementation-overview-list1
  short: "The two-frame components: encoding, changed-heap detection, Δ, and a move selector for a target δ"
  category: checked-definition
  lean: [NimAudit.LocalRestore.chgC_eval, NimAudit.LocalRestore.localDelta_eq, NimAudit.SelectCircuit.varSel_correct, NimAudit.PriorityEncoder.encode_correct]
  depends_on: [lem:nimber-diff-ac0, c-binary-index]

# ------------------------------------------------------------------ Section 5.4
- id: c-search-intro
  target: sec:search-gap-p1
  short: "Restatement of the single-frame barrier as the motivation for rollouts"
  category: informal
  depends_on: [thm:singleframe-impossible.b]

- id: def:rollout-policy
  short: "Deterministic rollout policies and the rollout outcome bit"
  category: checked-definition
  lean: [NimAudit.Game.rolloutWinner, NimAudit.Rollout.policyStep, NimAudit.Rollout.PolicyMove, NimAudit.Prob.rollout_outcome_linear]
  correspondence: "Lean defines the outcome of the structured policies $\\pi_j$ by executing the rollout (`rolloutWinner`). The general definition of an arbitrary $\\mathrm{AC}^0$-bounded rollout policy is not formalised as a separate object; the paper's results use only the structured family."
  audit_rows: [def:rollout-policy]

- id: def:agent-types
  short: "The restricted measurement interface: root and one-heap queries to one fixed structured head, bounded readout"
  category: checked-definition
  lean: [NimAudit.Prob.single_policy_affine, NimAudit.Misc.single_policy_correction, NimAudit.Misc.bitBoard_query, NimAudit.BinReadout.BBound]
  lean_defs: [NimAudit.Prob.CorrHyp]
  correspondence: "In the conditional bound the readout is any family of bounded-depth, polynomial-size binary circuits receiving the board and the observed bit. Query corrections must be computed inside that readout."
  audit_rows: [def:agent-types]

- id: c-arbitrary-starts
  target: sec:search-gap-p3
  short: "With arbitrary start positions, one rollout of π₀ on the boards of k-th bits returns σ_k(P)"
  category: checked-theorem
  lean: [NimAudit.Misc.bitBoard_query, NimAudit.Misc.nimSum_bitBoard]
  depends_on: [def:agent-types]

- id: rem:why-multi-head
  short: "Each rollout follows one policy and yields one bit; different heads give independent linear functionals"
  category: checked-theorem
  lean: [NimAudit.Game.rolloutWinner_channel, NimAudit.Prob.rollout_outcome_linear, NimAudit.Game.reconstruct_eq]
  lean_defs: [NimAudit.channel]
  audit_rows: [rem:why-multi-head]

- id: par:shootout-controller
  short: "Early stopping after a nonzero outcome leaves the decision (the OR of all channel bits) unchanged"
  category: checked-theorem
  lean: [NimAudit.Misc.shootout_spec, NimAudit.Misc.channels_or, NimAudit.Shootout.ee_spec]
  depends_on: [prop:rollout-sufficiency]
  audit_rows: [par:shootout-controller]

- id: c-fsm-definition
  target: par:shootout-controller-p2
  short: "A finite-state shootout controller: states, head selection, transitions, halting states"
  category: checked-definition
  lean: [NimAudit.Misc.FSM, NimAudit.Misc.FSM.run, NimAudit.Misc.shootout]

- id: c-fsm-power
  target: par:shootout-controller-p3
  short: "The controller organises which head is queried and when to stop; it adds no per-step power"
  category: informal
  depends_on: [c-outer-controller]

- id: c-outer-controller
  target: par:shootout-controller-p4
  short: "The implemented outer controller: early-exit classifier and all-head schedule for move selection"
  category: checked-theorem
  lean: [NimAudit.Shootout.ee_spec, NimAudit.Shootout.ee_net, NimAudit.Shootout.ahSel_wins, NimAudit.Shootout.ahL_counts, NimAudit.Shootout.sh_ac0, NimAudit.Shootout.sh_net]
  assumptions: "$B\\ge1$, heaps below $2^B$, head index in $r$ bits with $B\\le 2^r$; the original board is a read-only input at every tick."
  depends_on: [par:controller-costs, prop:rollout-sufficiency]
  audit_rows: [par:shootout-controller]

- id: fig:fsm-shootout-controller
  short: "The depicted controller decides whether σ(P) ≠ 0 using at most B queries"
  category: checked-theorem
  lean: [NimAudit.Misc.shootout_spec, NimAudit.Misc.shootout_decides]

- id: c-integration
  target: par:shootout-controller-p5
  short: "Channels versus protocol: heads supply measurement channels, the FSM sequential control"
  category: informal
  depends_on: [prop:single-policy-bound, prop:rollout-sufficiency]

- id: c-depth-amplification
  target: par-depth-amplification-p1
  short: "Iterating an AC⁰ policy for L game steps gives a depth-Θ(L) computation"
  category: informal
  depends_on: [prop:rollout-sufficiency, c-bypass-not-ac0]

- id: prop:rollout-sufficiency
  short: "B structured rollout heads recover all nim-sum bits; an AC⁰ readout then plays a winning move"
  category: checked-theorem
  lean: [NimAudit.Game.rolloutWinner_channel, NimAudit.Game.agent_wins, NimAudit.RolloutExec.mhExec_wins, NimAudit.RolloutExec.mhExec_evals, NimAudit.Game.totalRolloutMoves_le, NimAudit.Rollout.run_length, NimAudit.Mastery.mh_strong]
  lean_defs: [NimAudit.Game.agent, NimAudit.Game.reconstruct]
  assumptions: "Heaps below $2^B$; the opponent may play any legal move; rollouts are executed move by move (no outcome bit is supplied for free)."
  correspondence: "Lean proves the outcome identities for the executed rollout under every tie-breaking rule, the reconstruction, the winning guarantee against every legal opponent, and the bound $BN(2^B-1)$ on simulated moves. Circuit resources of each policy step and of the readout are in the records for Appendix C and Proposition 5.14."
  audit_rows: [prop:rollout-sufficiency, app:rollout-proofs]

- id: prop:single-policy-bound
