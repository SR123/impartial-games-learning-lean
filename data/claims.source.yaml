  assumptions: "$0\\le\\varepsilon<1/2$; flips independent within a block and fresh for each repetition; worst-case error at most $1/4$ for both values of the ideal bit; for the explicit bounds $0<a\\le1/2$."
  correspondence: "This is a channel-noise model. Lean does not model erroneous game moves or learned heads, and neither does the remark."
  depends_on: [prop:noise-samples]
  audit_rows: [rem:noisy-rollout-decay]

