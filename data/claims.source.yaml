  assumptions: "$N\\ge1$, $B\\ge1$; for (i) the established zero-nim-sum invariant with the opponent to move; for (iii) the replay protocol supplied by the environment, with $N<2^r$."
  correspondence: "Polynomial size and constant depth are certified for one evaluation of each component; they do not bound the number of sequential evaluations. The recurrent winning guarantees (part iii) are proved in their own stateful game semantics (`ReplayWins`, `BitStoreWins`), not in the general history model of Definition 5.1; see the open item on that bridge."
  depends_on: [c-restore-selector, prop:rollout-sufficiency, c-replay, c-board-storage, c-depth-table]
