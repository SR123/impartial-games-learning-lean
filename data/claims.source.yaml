# ------------------------------------------------------------------ Appendix A
- id: app:precision
  short: "Representable parameters: a fixed finite grid independent of n; negations allowed on wires"
  category: checked-definition
  lean: [NimAudit.AC0.Gate.Valid, NimAudit.AC0.gate_rat_iff]
  lean_defs: [NimAudit.AC0.Gate]
  audit_rows: [app:defs, app:precision]

- id: def:NN-formal
  short: "Literal-threshold network: layers of gates with grid weights, grid thresholds and negation bits"
  category: checked-definition
  lean: [NimAudit.AC0.Gate, NimAudit.AC0.Layer, NimAudit.AC0.evalNet, NimAudit.AC0.NetValid, NimAudit.AC0.gate_rat_iff, NimAudit.FiniteNet.netFormula_spec]
  correspondence: "Lean stores integer coefficients $a_j$ and threshold $b$ (weights $a_j/D$, threshold $b/D$) and proves that the rational Heaviside form fires exactly when the integer form does."
  audit_rows: [def:NN-formal, app:NN]

- id: def:RNN-formal
  short: "Bounded-unrolling recurrence: at most T updates in total from an input-independent initial state"
  category: checked-definition
  lean: [NimAudit.Windows.window_ac0, NimAudit.Windows.window_size_closed, NimAudit.AC0.rnn_ac0]
  lean_defs: [NimAudit.Windows.wState, NimAudit.Windows.winIn]
  audit_rows: [def:RNN-formal, app:RNN]

- id: def:LTST-formal
  short: "Gate-realised attention-style model: every operation implemented in the permitted gates"
  category: checked-definition
  lean: [NimAudit.Windows.staged_ac0]
  lean_defs: [NimAudit.Windows.runStages]
  correspondence: "No claim is made about standard softmax attention; Lean covers a model given as a constant number of stages, each a valid gate network."
  audit_rows: [def:LTST-formal, app:LTST]

- id: x-remark-scope-of-the-simulation
  short: "Theorem 2.4 applies because L, T, W, D are constants and parameters come from a finite grid"
  category: informal
  depends_on: [thm:sim-ac0]

# ------------------------------------------------------------------ Appendix B
- id: lem:unit-ac0
  short: "One fixed-scale threshold gate is a depth-2 DNF of size O(m^W)"
  category: checked-theorem
  lean: [NimAudit.AC0.Gate.bounded_witness, NimAudit.AC0.gate_ac0, NimAudit.ClassicalBoundary.dnf_aoDepth]
  lean_defs: [NimAudit.AC0.dnf]
  correspondence: "Lean's depth counts NOT gates and gives depth at most 3; in the classical convention (negations on inputs not counted) the same DNF has AND/OR depth 2. The Lean size bound is $1+(m+1)^W(2W+1)$."
  audit_rows: [lem:unit-ac0, app:oneunit]

- id: x-remark-negations
  short: "Negated inputs replace z_j by ¬z_j in each conjunction; the lemma still applies"
  category: checked-theorem
  lean: [NimAudit.AC0.gate_ac0, NimAudit.AC0.eval_dnf]
  depends_on: [lem:unit-ac0]

- id: lem:layer-ac0
  short: "A layer of polynomially many fixed-scale units is simulated with constant depth and polynomial size"
  category: checked-theorem
  lean: [NimAudit.AC0.eval_compileLayer, NimAudit.AC0.compileLayer_size, NimAudit.AC0.compileLayer_depth]
  lean_defs: [NimAudit.AC0.compileLayer]
  audit_rows: [lem:layer-ac0, app:network]

# ------------------------------------------------------------------ Appendix C
- id: app:impl
  short: "Shared shallow operations: candidate tests, binary index, recurrent update, threshold realisation"
  category: checked-theorem
  lean: [NimAudit.PriorityEncoder.encode_correct, NimAudit.ThresholdNet.compileF_spec, NimAudit.ThresholdNet.compileF_fixed_grid, NimAudit.BoardStore.bs_net]
  depends_on: [c-candidate-moves, c-binary-index, c-recurrent-update, c-threshold-realisation, c-depth-table]
  audit_rows: [app:impl]

- id: c-candidate-moves
  target: par-local-differences-and-candidate-moves-p1
  short: "Delta bits by OR under the single-change promise; the shallow test y_i < x_i; the subtract-one fallback"
  category: checked-theorem
  lean: [NimAudit.LocalRestore.dC_eval, NimAudit.LocalRestore.localDelta_eq, NimAudit.AttainCircuit.cancel_iff_bit, NimAudit.SelectCircuit.genSel_correct, NimAudit.SelectCircuit.varSel_correct]
  depends_on: [lem:nimber-diff-ac0]

- id: c-binary-index
  target: par-a-binary-index-is-part-of-the-circuit-p1
  short: "The priority encoder produces the binary index of the first candidate, for every flag pattern"
  category: checked-theorem
  lean: [NimAudit.PriorityEncoder.encode_correct, NimAudit.PriorityEncoder.encode_bound, NimAudit.PriorityEncoder.encode_noflag, NimAudit.PriorityEncoder.encode_least, NimAudit.PriorityEncoder.encode_zero, NimAudit.PriorityEncoder.encode_one]
  lean_defs: [NimAudit.PriorityEncoder.encode]
  assumptions: "Index width $r$ with $N\\le 2^r$ (the replay counter needs $N<2^r$)."
  audit_rows: [app:impl]

- id: c-recurrent-update
  target: par-the-recurrent-update-p1
  short: "Scan and replay updates are shallow; bit-level refinement and register bounds hold on well-formed streams"
  category: checked-theorem
  lean: [NimAudit.ControllerBits.step_refines, NimAudit.ControllerBits.brun_refines, NimAudit.ControllerBits.bstep_reset, NimAudit.Controller.stream_fits, NimAudit.Family.ctrl_ac0]
  depends_on: [c-replay]

- id: c-threshold-realisation
  target: par-realisation-with-fixed-scale-threshold-gates-p1
  short: "Compiler from formulas to {0,1}-weight threshold networks: ≤2d+2 layers, ≤(2d+1)S+K gates, widths ≤ S+n"
  category: checked-theorem
  lean: [NimAudit.ThresholdNet.compileF_spec, NimAudit.ThresholdNet.compileF_fixed_grid, NimAudit.ThresholdNet.compileF_bounded]
  lean_defs: [NimAudit.ThresholdNet.compileF]
  audit_rows: [app:impl]

- id: c-depth-table
  target: par-realisation-with-fixed-scale-threshold-gates-table1
  short: "Certified depth and layer bounds for one evaluation of each component"
  category: checked-theorem
  lean: [NimAudit.Family.rest_ac0, NimAudit.Family.rest_net, NimAudit.Family.mh_ac0, NimAudit.Family.mh_net, NimAudit.Family.pol_ac0, NimAudit.Family.pol_net, NimAudit.Family.ctrl_ac0, NimAudit.Family.ctrl_net, NimAudit.Shootout.sh_ac0, NimAudit.Shootout.sh_net]
  correspondence: "Each bound is for one evaluation of the component (one move selection, one policy step, one controller update or tick). The time needed to repeat evaluations is part of the algorithm, not of these bounds."
  audit_rows: [app:impl]

- id: par:controller-costs
  short: "Shootout controller: NB+4+r+B state bits plus the read-only original board"
  category: checked-theorem
  lean: [NimAudit.Shootout.sh_ac0, NimAudit.Shootout.sh_net, NimAudit.Shootout.ee_spec, NimAudit.Shootout.ahSel_wins]
  lean_defs: [NimAudit.Shootout.enc, NimAudit.Shootout.IW]
  correspondence: "The certified input width of one tick is $IW=2BN+B+r+5$: the $NB+4+r+B$ register bits, one reset bit and the $NB$ bits of the original board, which is held fixed."
  audit_rows: [par:controller-costs]

- id: c-controller-evals
  target: par:controller-costs-p2
  short: "All-head schedule: M+2B+2 component evaluations, with M ≤ BN(2^B−1)"
  category: checked-theorem
  lean: [NimAudit.Shootout.ahL_counts, NimAudit.Shootout.ah_counts, NimAudit.Shootout.ee_counts]
  depends_on: [par:controller-costs]
  audit_rows: [par:controller-costs]

# ------------------------------------------------------------------ Appendix D
- id: x-example-pairing-strategy
  short: "Pairing strategy: a constant-depth mirror selector wins as second player on paired boards"
  category: checked-theorem
  lean: [NimAudit.Misc.pairing_wins, NimAudit.Misc.pairR_correct, NimAudit.Misc.pairBin_bound, NimAudit.Mastery.pairing_net_weak, NimAudit.Mastery.pairing_first_vacuous]
  lean_defs: [NimAudit.Misc.Paired]
  audit_rows: [app:weak]

- id: c-weak-vs-strong
  target: app:weak-p1
  short: "From (3), taking all stones weakly masters the position but is not strong mastery"
  category: checked-theorem
  lean: [NimAudit.Mastery.sep3_weak, NimAudit.Mastery.sep3_not_strong, NimAudit.Mastery.strong_weak]
  lean_defs: [NimAudit.Mastery.sep3]
  audit_rows: [app:weak]

# ------------------------------------------------------------------ Appendix F
- id: c-noise-model
  target: app:noise-samples-p1
  short: "Symmetric channel with agreement (1+a)/2; m*(a) is the least sample count with both errors ≤ 1/4"
  category: checked-definition
  lean: [NimAudit.RealNoise.pOf, NimAudit.RealNoise.chan_law, NimAudit.RealNoise.Ach, NimAudit.RealNoise.mMin, NimAudit.RealNoise.mMin_spec]
  audit_rows: [app:noise-samples]

- id: prop:noise-samples
  short: "3/(32a²) ≤ m*(a) ≤ ⌈4/a²⌉ ≤ 17/(4a²); majority with ties declared 0 attains the middle bound"
  category: checked-theorem
  lean: [NimAudit.RealNoise.mMin_spec, NimAudit.RealNoise.mMin_bounds, NimAudit.RealNoise.mMin_theta, NimAudit.RealNoise.majority_succeeds, NimAudit.RealNoise.any_rule_needs]
  lean_defs: [NimAudit.RealNoise.mUp]
  assumptions: "$0<a\\le1/2$; observations independent given $Y$; randomised decision rules allowed; error at most $1/4$ for each value of $Y$."
  audit_rows: [prop:noise-samples, app:noise-samples]

- id: c-flip-cases
  target: app:noise-samples-p2
  short: "The flip model gives a=(1−2ε)^L; small bias eventually; ε=0 or L=0 exact; a=0 hopeless; reuse gives nothing"
  category: checked-theorem
  lean: [NimAudit.RealNoise.flip_repeated, NimAudit.RealNoise.flip_mMin, NimAudit.RealNoise.eventually_small, NimAudit.RealNoise.flip_exact, NimAudit.RealNoise.zero_signal_never, NimAudit.Noise.no_signal, NimAudit.RealNoise.reuse_any_rule]
  audit_rows: [app:noise-samples]

# ------------------------------------------------------------------ Appendix G, H
- id: app:rollout-proofs
  short: "Full proof of Proposition 5.9: rollout counts, outcome identities, selector, winning, step bound"
  category: checked-theorem
  lean: [NimAudit.Rollout.run_length, NimAudit.Rollout.run_parity, NimAudit.Game.reconstruct_eq, NimAudit.Rollout.exists_decreasing_heap, NimAudit.Game.agent_wins, NimAudit.Game.totalRolloutMoves_le]
  depends_on: [prop:rollout-sufficiency]
  audit_rows: [app:rollout-proofs]

- id: app:search-gap-proof
  short: "Full proof of Theorem 5.12: uniform σ, character expansion, finite bound, Håstad input, attainability"
  category: checked-conditional
  lean: [NimAudit.Prob.success_bound, NimAudit.CorrBridge.circuit_readout_bound, NimAudit.ClassicalBoundary.search_gap_asymptotic, NimAudit.Attain.attain_exact, NimAudit.Attain.paper_example_two_thirds]
  named_inputs: [HastadNegl]
  depends_on: [thm:search-gap.i]
  audit_rows: [app:search-gap-proof]

- id: eq:finite-correlation-bound
  short: "Under the stated correlation premise η_N: success ≤ 2/(q−1) + (q−1)η_N"
  category: checked-theorem
  lean: [NimAudit.Prob.success_bound]
  lean_defs: [NimAudit.Prob.CorrHyp]
  assumptions: "The premise: $|\\mathbb E_U[H_{b,a}\\chi_u]|\\le\\eta_N$ for all $b$, all $a$ and all nonzero $u$, under the unconditioned uniform distribution."
  correspondence: "This inequality is proved outright from its stated premise. Only the step that supplies a negligible $\\eta_N$ for AC⁰ readouts uses the classical input."
  audit_rows: [eq:finite-correlation-bound]

