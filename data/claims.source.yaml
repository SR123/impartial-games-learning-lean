  assumptions: "The head is one fixed member $\\pi_j$ of the structured family; queries are the root and boards differing from it in one known heap."
  audit_rows: [prop:single-policy-bound]

- id: rem:noisy-rollout-decay
  short: "Independent outcome flips: agreement (1+(1−2ε)^L)/2 and Θ(a⁻²) repetitions with fresh randomness"
  category: checked-theorem
