- id: thm:search-gap.i
  target: thm:search-gap
  part: "(i)"
  short: "One structured head plus an AC⁰ readout wins with probability at most 2/(2^B−1)+negl(N)"
  category: checked-conditional
  lean: [NimAudit.Prob.success_bound, NimAudit.CorrBridge.circuit_readout_bound, NimAudit.ClassicalBoundary.search_gap_asymptotic, NimAudit.ClassicalBoundary.search_gap_asymptotic_net, NimAudit.Attain.attain_exact]
  lean_defs: [NimAudit.Prob.CorrHyp, NimAudit.ClassicalBoundary.HastadNegl, NimAudit.ClassicalBoundary.Negligible]
  named_inputs: [HastadNegl]
  assumptions: "Fixed $B\\ge2$; boards uniform on $\\{0,\\dots,2^B-1\\}^N$ conditioned on $\\sigma\\ne0$; one fixed structured head; readout circuits of fixed depth and polynomial size (or fixed-scale networks of fixed depth)."
  correspondence: "The finite bound holds under the explicit correlation premise `CorrHyp` (proved without any classical input). The asymptotic form uses the named input `HastadNegl`, from which the premise is derived for the readout indicators; the analytic derivation of Håstad's bound is external. Attainability of $2/(2^B-1)$ is proved exactly."
  depends_on: [def:agent-types, prop:single-policy-bound, eq:finite-correlation-bound]
