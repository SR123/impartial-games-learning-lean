  snippet: "In our encoding, the $j$th bit of the nim-sum is the parity of the $j$th bits across all $N$ heaps"
  in: par-local-vs-global-parity-in-nim
  short: "A nim-sum bit is a degree-N character; for a known changed heap a delta bit is a two-coordinate character"
  category: checked-theorem
  lean: [NimAudit.RealFourier.nimBit_spectrum_real, NimAudit.RealFourier.delta_spectrum_real, NimAudit.Misc.nimsum_bit_character, NimAudit.Fourier.nimBit_corr_of_tail]
